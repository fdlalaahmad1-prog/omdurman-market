<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة سوق أمدرمان</title><link rel="stylesheet" href="/style.css"><style>.adminmain{max-width:1200px;margin:auto;padding:20px 15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:#fff;padding:17px;border:1px solid #e2e8f0;border-radius:12px}.stat b{display:block;font-size:24px}.panel{margin-top:18px;overflow:auto}.panel h2{margin-top:0}.adminform{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.adminform input,.adminform textarea,.adminform select{padding:10px;border:1px solid #dbe2ea;border-radius:7px;font:inherit;width:100%}.adminform textarea{grid-column:1/-1}.adminform button{grid-column:1/-1}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:right;padding:10px;border-bottom:1px solid #e2e8f0;font-size:12px}.table select{padding:6px;border:1px solid #e2e8f0;border-radius:6px}.statusmsg{color:#64748b;font-size:13px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.adminform{grid-template-columns:1fr}.adminform textarea,.adminform button{grid-column:auto}}</style></head><body><div class="topline">لوحة إدارة سوق أمدرمان</div><header class="header"><a class="brand" href="/"><span class="mark">أ</span><span><b>إدارة السوق</b><small>إدارة المنتجات والطلبات</small></span></a><a class="outline" href="/">العودة إلى المتجر</a><button id="reload" class="outline">تحديث البيانات</button></header><main class="adminmain"><div id="status" class="statusmsg">جارٍ التحقق من صلاحية المدير...</div><section id="dashboard" hidden><div class="stats" id="stats"></div><section class="panel"><h2>إضافة منتج</h2><form id="productForm" class="adminform"><input name="name" placeholder="اسم المنتج" required><input name="category" placeholder="القسم" required><input name="price" type="number" min="0" placeholder="السعر بالجنيه السوداني" required><input name="old_price" type="number" min="0" placeholder="السعر القديم (اختياري)" value="0"><input name="stock" type="number" min="0" placeholder="المخزون" required><input name="emoji" placeholder="رمز تعبيري" value="🛍️"><input name="image_url" placeholder="رابط صورة HTTPS (اختياري)"><textarea name="description" placeholder="وصف المنتج"></textarea><button class="btn">إضافة المنتج</button></form></section><section class="panel"><h2>المنتجات</h2><table class="table"><thead><tr><th>#</th><th>المنتج</th><th>القسم</th><th>السعر</th><th>المخزون</th><th>الحالة</th><th>حفظ</th></tr></thead><tbody id="adminProducts"></tbody></table></section><section class="panel"><h2>الطلبات</h2><table class="table"><thead><tr><th>رقم</th><th>العميل</th><th>الهاتف</th><th>العنوان</th><th>المنتجات</th><th>الإجمالي</th><th>الحالة</th><th>تحديث</th></tr></thead><tbody id="adminOrders"></tbody></table></section><section class="panel"><h2>طلبات انضمام التجار</h2><table class="table"><thead><tr><th>#</th><th>المتجر</th><th>الهاتف</th><th>النشاط</th><th>التفاصيل</th><th>الحالة</th><th>تحديث</th></tr></thead><tbody id="applications"></tbody></table></section></section></main><div id="toast"></div><script src="/admin.js" defer></script></body></html>
